<!doctype html>
<html lang="de">

<head>
    <title>Flight Radar</title>
    <meta charset="UTF-8" />
    <style>
        /* Hier kann ich den margin vom Body überschreibe oder die background-color setzen usw. */
        /* Die Root-Variablen --accent-color, --coontent-color und --card-color sind immer vordefiniert. */
        /* Kann aber auch eigene Variablen definieren. Gute Technik um nicht direkt das CSS zu manipulieren zu müssen */

        :root {
            --status-green: #58A906;
            --status-yellow: #FFC107;
            --status-red: #F35A2C;
        }

        html,
        body {
            margin: 15px 0;
            overflow: hidden;
        }

        .flight-carousel {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .nav-indicators {
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .nav-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: color-mix(in srgb, var(--content-color) 20%, transparent);
            transition: all 0.3s;
            cursor: pointer;
        }

        .nav-indicator:hover {
            background: color-mix(in srgb, var(--content-color) 40%, transparent);
        }

        .nav-indicator.active {
            background: var(--accent-color);
            transform: scale(1.2);
        }

        .flight-carousel-wrapper {
            display: flex;
            transition: transform 0.4s ease-in-out;
            height: 100%;
        }

        .flight-carousel-slide {
            min-width: 100%;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .nav-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--content-color);
            font-size: 14px;
            width: 25px;
            height: 25px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 100;
            user-select: none;
        }

        .nav-button.prev {
            left: -3px;
        }

        .nav-button.next {
            right: -3px;
        }

        .flight-card {
            padding: 20px;
        }

        .flight-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .flight-number {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-color);
            line-height: 1.2;
        }

        .flight-callsign {
            font-size: 14px;
            color: var(--content-color);
            font-weight: normal;
            margin-top: 2px;
        }

        .flight-status {
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .flight-status.green {
            background: var(--status-green);
        }

        .flight-status.yellow {
            background: var(--status-yellow);
        }

        .flight-status.red {
            background: var(--status-red);
        }

        .flight-route {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 18px;
            color: var(--content-color);
            margin: 15px 0;
            font-weight: 500;
            justify-content: center;
        }

        .flight-arrow {
            fill: var(--content-color);
            margin: 0 8px;
            width: 24px;
            height: 24px;
        }

        .flight-details {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }

        .flight-detail {
            background: color-mix(in srgb, var(--accent-color) 10%, transparent);
            padding: 10px;
            border-radius: 8px;
        }

        .flight-detail-label {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 4px;
            /* opacity: 0.6; */
            color: var(--accent-color);
        }

        .flight-detail-value {
            font-size: 16px;
            color: var(--content-color);
            font-weight: 400;
        }

        .flight-schedule {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }

        .schedule-box {
            background: color-mix(in srgb, var(--accent-color) 10%, transparent);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .schedule-box.arrival {
            flex-direction: row-reverse;
        }

        .schedule-icon {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }

        .schedule-icon svg {
            width: 100%;
            height: 100%;
            fill: var(--content-color);
        }

        .schedule-times {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex: 1;
        }

        .schedule-box.arrival .schedule-times {
            text-align: right;
        }

        .schedule-box.arrival .schedule-time {
            flex-direction: row-reverse;
        }

        .schedule-time {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .schedule-time-label {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            /* opacity: 0.6; */
            color: var(--accent-color);
        }

        .schedule-time-value {
            font-family: monospace;
            color: var(--content-color);
            font-weight: 400;
            font-size: 13px;
        }

        .schedule-time-value.green {
            color: var(--status-green);
        }

        .schedule-time-value.yellow {
            color: var(--status-yellow);
        }

        .schedule-time-value.red {
            color: var(--status-red);
        }

        .flight-airline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--accent-color);
        }

        .airline-section {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .airline-logo {
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: var(--accent-color);
            overflow: hidden;
        }

        .airline-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .airline-info {
            flex: 1;
        }

        .airline-name {
            font-size: 14px;
            font-weight: 400;
        }

        .aircraft-type {
            font-size: 12px;
            margin-top: 2px;
            opacity: 0.5;
        }

        .aircraft-image {
            height: 64px;
            object-fit: contain;
            border-radius: 8px;
        }

        .aircraft-image-container {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }
    </style>
</head>

    <script>
        let currentIndex = 0;
        const wrapper = document.getElementById('flightCarouselWrapper');
        const indicatorsContainer = document.getElementById('nav-indicators');
        // Funktion zum Initialisieren/Aktualisieren des Carousels
        // Nach dem Update der Cards einfach initializeCarousel() aufrufen
        function initializeCarousel() {
            const slides = document.querySelectorAll('.flight-carousel-slide');
            const totalSlides = slides.length;

            // Lösche alle existierenden Indikatoren
            indicatorsContainer.innerHTML = '';

            // Erstelle neue Indikatoren
            for (let i = 0; i < totalSlides; i++) {
                const indicator = document.createElement('div');
                indicator.className = 'nav-indicator' + (i === currentIndex ? ' active' : '');
                indicator.onclick = () => goToSlide(i);
                indicatorsContainer.appendChild(indicator);
            }

            // Stelle sicher, dass currentIndex nicht außerhalb des gültigen Bereichs liegt
            if (currentIndex >= totalSlides) {
                currentIndex = Math.max(0, totalSlides - 1);
            }

            // Aktualisiere Carousel-Position
            if (totalSlides > 0) {
                wrapper.style.transform = `translateX(-${currentIndex * 100}%)`;
            }
        }

        // Initialisiere beim Laden
        initializeCarousel();

        function nextCard() {
            const totalSlides = document.querySelectorAll('.flight-carousel-slide').length;
            currentIndex = (currentIndex + 1) % totalSlides;
            initializeCarousel();
        }

        function prevCard() {
            const totalSlides = document.querySelectorAll('.flight-carousel-slide').length;
            currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
            initializeCarousel();
        }

        function goToSlide(index) {
            currentIndex = index;
            updateCarousel();
        }

        // Tastatur-Navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') prevCard();
            if (e.key === 'ArrowRight') nextCard();
        });

        // Touch-Navigation
        let touchStartX = 0;
        let touchEndX = 0;

        wrapper.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });

        wrapper.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            if (touchEndX < touchStartX - 50) nextCard();
            if (touchEndX > touchStartX + 50) prevCard();
        }
        // Hier werden die Daten vom Modul verarbeitet.
        function handleMessage(data) {
            //console.log('Rohdaten empfangen:', data);
            const decodedData = JSON.parse(data);
            //console.log('Decodierte Daten:', decodedData);
            var root = document.documentElement;
            for (const parameter in decodedData) {
                console.log('Parameter:', parameter, 'Wert:', decodedData[parameter]);
                switch (parameter) {
                    case 'flights':
                        updateFlights(decodedData[parameter]);
                        break;
                    default:
                        console.log('Unbekannter Parameter:', parameter);
                        break;
                }
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }

        function formatDistance(distance) {
            if (distance < 1) {
                return (distance * 1000).toFixed(0) + ' m';
            }
            return distance.toFixed(1) + ' km';
        }

        function formatTime(time, text='') {
            if (time !== 'N/A') {
                return new Date(time * 1000).toLocaleTimeString('de-DE', {
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                    });
            }
            if(text !== '') {
                const tt = text.split(" ")[1];
                return tt;
            }
            return '&#8209;&#8209;:&#8209;&#8209;';
        }

                    </div>
                    <div class="flight-details">
                        <div class="flight-detail">
                            <div class="flight-detail-label">Höhe</div>
                            <div class="flight-detail-value">${formatNumber(flight.altitude)} ft</div>
                        </div>
                        <div class="flight-detail">
                            <div class="flight-detail-label">Geschwindigkeit</div>
                            <div class="flight-detail-value">${formatNumber(flight.speed)} kts</div>
                        </div>
                        <div class="flight-detail">
                            <div class="flight-detail-label">Entfernung</div>
                            <div class="flight-detail-value">${formatDistance(flight.distance)}</div>
                        </div>
                    </div>
                    <div class="flight-airline">
                        <div class="airline-section">
                            <div class="airline-logo">
                                <img src="https://images.kiwi.com/airlines/64/${flight.airline.iata}.png" alt="${escapeHtml(flight.airline.short)}"
                                    onerror="this.parentElement.innerHTML='N/A'">
                            </div>
                            <div class="airline-info">
                                <div class="airline-name">${escapeHtml(flight.airline.name)}</div>
                                <div class="aircraft-type">${escapeHtml(flight.aircraft.model)} • ${escapeHtml(flight.aircraft.registration)}</div>
                            </div>
                        </div>
                        <div class="aircraft-image-container">
                            <img src="${flight.aircraft.image}" alt="Aircraft" class="aircraft-image" onerror="this.style.display='none'">
                        </div>
                    </div>
                </div>
            </div>
                `;
            }
            document.getElementById('flightCarouselWrapper').innerHTML = html;
            initializeCarousel()
        }

    </script>
</body>

</html>
